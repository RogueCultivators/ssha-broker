# ssha 配置
#
# 一台主机最少只要：地址、用户名、登录方式，加一条备注。
# 备注是 agent 唯一能"找"到机器的线索——它会被搜索，所以用你自己的话
# 写清楚这台机器上跑什么。
#
#   ssha ui                  # 在浏览器里改（中文界面）
#   ssha hosts list          # 看看有什么
#   ssha hosts find 支付     # agent 就是这么找机器的
#   ssha hosts test <name>   # 自检：主机密钥 + 认证 + 能否执行命令
#   ssha hosts import        # 从 ~/.ssh/config 批量导入

version: 1

# ---------------------------------------------------------------------------
# 全局策略：所有主机生效，单台可以覆盖
#
#   allow     除 deny_commands 外都允许
#   readonly  只允许 allow_commands 命中，并且拒绝 shell 元字符
#   deny      什么都不允许
#
# 对不完全信任的 agent，建议默认 readonly。
# ---------------------------------------------------------------------------
policy:
  mode: allow
  timeout: 60s
  max_output_bytes: 262144
  # 正则，命中即拒绝（deny 永远优先）。这些是兜底的安全网，不是防绕过的手段。
  deny_commands:
    - 'rm\s+-rf\s+/'
    - '\bmkfs\b'
    - '\b(shutdown|reboot|poweroff)\b'

# ---------------------------------------------------------------------------
# 审计：每条命令一行 JSON，带 SHA-256 哈希链
# 校验：ssha audit verify      查询：ssha audit ls --host x
# ---------------------------------------------------------------------------
audit:
  path: ~/.local/share/ssha/audit.jsonl
  store_output: true
  max_field_bytes: 65536

# ---------------------------------------------------------------------------
# 给 agent 用的 MCP 服务（可选）
#   ssha mcp                      本机 stdio，给 Codex / pi / Claude Code
#   ssha mcp --http 0.0.0.0:8765  局域网，必须配 token，否则拒绝启动
# ---------------------------------------------------------------------------
# server:
#   http_addr: 127.0.0.1:8765
#   tokens:
#     - name: my-agent
#       value_env: SSHA_TOKEN_AGENT
#       tags: [staging]              # 这个 token 只够得着这些主机

hosts:
  # -------------------------------------------------------------------------
  # 最小写法：地址 + 用户名 + 登录方式 + 备注
  # -------------------------------------------------------------------------
  - name: prod-web
    addr: 10.0.0.10
    user: deploy
    description: |
      公网 Web 前端，nginx 反向代理。
      后面是 checkout-api：systemd 单元 checkout-api.service，端口 8080，
      日志 /var/log/checkout/api.log，重启会先 drain 在途请求。
    auth:
      type: key                     # key | agent | password
      key_path: ~/.ssh/id_ed25519
      # 加密私钥的口令来源（环境变量优先，其次文件，最后 CLI 交互输入）
      # passphrase_env: SSHA_KEY_PASSPHRASE
      # passphrase_file: ~/.config/ssha/id_ed25519.pass
      # key_env: SSHA_PRIVATE_KEY    # 直接放 PEM 内容，CI 用

  # -------------------------------------------------------------------------
  # 只读：agent 只能看，不能改
  # -------------------------------------------------------------------------
  - name: prod-db
    addr: 10.0.0.20
    user: dba
    description: 主数据库。只读巡检用，不要在这里写任何东西。
    auth:
      type: key
      key_path: ~/.ssh/id_ed25519
    policy:
      mode: readonly
      # readonly 默认拒绝 shell 元字符（; | & < > 反引号 换行 $(），
      # 一条命令只能是一个简单命令。需要管道就打开这个开关，并清楚代价。
      allow_shell_metacharacters: false
      allow_commands:
        - '^ls\b'
        - '^cat\b'
        - '^df\b'
        - '^free\b'
        - '^uptime\b'
        - '^ps\b'
        - '^systemctl\s+status\b'
        - '^journalctl\b'

  # -------------------------------------------------------------------------
  # 密码登录：密码放文件或环境变量，不写在配置里
  #   install -m 600 /dev/null ~/.config/ssha/legacy.pass
  #   read -rs -p 'password: ' P && printf '%s\n' "$P" > ~/.config/ssha/legacy.pass
  #
  # 两者都不配的话，CLI 会交互式提问；但 MCP 不会提问，会直接报错。
  # -------------------------------------------------------------------------
  - name: legacy
    addr: 10.0.0.30
    user: root
    description: 老机器，只跑一个定时任务。密码登录。
    auth:
      type: password
      password_file: ~/.config/ssha/legacy.pass
      # password_env: SSHA_LEGACY_PASSWORD    # 优先级更高

  # -------------------------------------------------------------------------
  # 跳板机：agent 不该在它上面执行任何东西
  # -------------------------------------------------------------------------
  - name: bastion
    addr: bastion.example.com
    user: jump
    description: 跳板机，只用来中转。
    auth:
      type: agent                   # 走本地 ssh-agent，磁盘上不放私钥
    policy:
      mode: deny

# ---------------------------------------------------------------------------
# 可选项速查（按需打开）
#
#   tags: [prod, web]                     # 分组，配合 ssha hosts list --tag prod
#   port: 2222                            # 非 22 端口
#   work_dir: /srv/app                    # 默认工作目录
#   env: { APP_ENV: prod }                # 默认环境变量
#   proxy_jump: bastion                   # 通过另一台主机（写它的 name）
#   disabled: true                        # 留在文件里但永不被选中
#
#   host_key:                             # 主机密钥校验，默认 fail-closed
#     known_hosts: ~/.ssh/known_hosts     # 不给就用 ~/.ssh/known_hosts
#     fingerprints: ["SHA256:..."]        # 或者直接钉指纹
#     insecure: true                      # 关掉校验，仅测试
#
#   policy:                               # 单台覆盖全局策略
#     mode: allow|readonly|deny
#     timeout: 30s
#     max_output_bytes: 131072
#     deny_paths: ['^/etc/shadow$']       # 禁止上传/下载的路径
#     disclosure: full|alias|blind        # 给 agent 看多少身份信息
#     redact_output: true                 # 输出里的地址/用户名换成 <host>/<user>
#     redact_patterns: ['\b\d{1,3}(\.\d{1,3}){3}\b']
# ---------------------------------------------------------------------------
